messages:
  - role: system
    content: >-
      You are working in the repository:


      therassistantllc/THERASSISTANTEHR


      This is Therassistant EHR, a behavioral health EHR, patient portal,
      clinician workflow, administrative workflow, and revenue-cycle management
      system.


      Do not treat this as a generic EHR.

      Do not invent workflows.

      Do not invent Supabase tables.

      Do not create disconnected UI.

      Do not create mock-only functionality unless explicitly asked for a
      mockup.

      Do not create duplicate modules when an existing module, route, component,
      table, or workflow already exists.


      Before making changes, inspect the actual repo files, routes, components,
      API routes, Supabase calls, workflow helpers, and existing database table
      usage.


      Core Product Areas


      Therassistant EHR includes these system areas:


      1. Schedule / Calendar

      2. Clinician Agenda

      3. Client / Patient Chart

      4. Intake

      5. Check-In

      6. Clinical Documentation

      7. SOAP Notes

      8. Treatment / Documentation Support

      9. Client Portal

      10. Portal Journal

      11. Inbox / Tasks / Workqueues

      12. Chat

      13. Mailroom

      14. Staff / Users

      15. Settings

      16. Admin / System Readiness

      17. Audit Log

      18. Billing Defaults

      19. Eligibility

      20. Authorization

      21. Charge Capture

      22. Claims

      23. Ready to Generate

      24. 837P Batches

      25. Claim Submission

      26. Rejections

      27. Denials

      28. Appeals

      29. AR Follow-Up

      30. ERA / 835

      31. Payment Posting

      32. Manual Payments

      33. Paper Checks

      34. Client Responsibility

      35. Client Billing

      36. Statements

      37. Refunds

      38. Credit Balances

      39. Recoupments

      40. Write-Offs

      41. Reconciliation

      42. Reporting

      43. FHIR Exports / Mapping


      Navigation Context


      The primary app navigation includes:


      - Schedule

      - Clients

      - Inbox

      - Chat

      - Mailroom

      - Settings

      - Admin

      - Billing


      The Billing navigation includes:


      - Dashboard

      - Charge Capture

      - Ready to Generate

      - 837P Batches

      - Eligibility

      - Claims

      - Rejections

      - Denials

      - Payments


      Do not add new top-level navigation unless the feature truly does not
      belong under an existing section.


      Core Clinical-to-Billing Workflow


      The system must support:


      Schedule → Appointment → Encounter → Clinical Note → Signed Note → Charge
      Capture → Professional Claim → 837P → Submission → ERA / Payment Posting →
      Client Responsibility → Reporting


      The signed clinical note is the charge-capture event.


      When a complete clinical note is signed, the system should:


      1. Update encounter_notes.status to signed.

      2. Populate encounter_notes.signed_at.

      3. Evaluate encounter readiness.

      4. If readiness passes:
         - update encounters.documentation_status
         - update encounters.billing_status
         - create or find a professional_claims record
         - create professional_claim_service_lines
         - update or insert charge_capture_items
         - populate charge_capture_items.claim_id
         - create or update the correct workqueue_items record
         - create an audit_logs record
      5. If readiness fails:
         - move the encounter to documentation hold / review
         - create a documentation hold workqueue item
         - show the missing readiness requirements

      Readiness requires:


      - encounter exists

      - signed clinical note exists

      - diagnosis exists

      - service line exists

      - primary insurance policy exists

      - billable duration exists and is at least 16 minutes


      Known Core Tables


      Known table names used in the repo include:


      - appointments

      - encounters

      - encounter_notes

      - encounter_diagnoses

      - encounter_service_lines

      - insurance_policies

      - workqueue_items

      - professional_claims

      - professional_claim_service_lines

      - charge_capture_items

      - claim_submissions

      - claim_status_events

      - audit_logs


      Before adding a new table, search the repo for an existing table or
      workflow that already handles the concept.


      Schedule / Calendar Rules


      Schedule must support:


      - viewing appointments

      - creating appointments

      - opening appointments

      - starting or opening encounters from appointments

      - connecting appointments to clients and providers

      - supporting clinician agenda workflows

      - supporting patient check-in workflows

      - supporting billing data defaults where applicable


      Any appointment workflow must preserve linkage to:


      - client / patient

      - provider

      - appointment

      - encounter

      - service date

      - start / end time

      - appointment status


      Client / Patient Chart Rules


      The client chart must serve as the source for:


      - demographics

      - insurance / policies

      - appointments

      - encounters

      - clinical notes

      - workqueue items

      - billing / claims

      - balances

      - portal-related activity where applicable


      Do not build a disconnected client screen that does not use existing
      client/patient routes or data relationships.


      Client chart workqueues must show only items related to the selected
      client.


      Intake Rules


      Intake must support:


      - token-based intake access when applicable

      - collecting client demographic information

      - collecting insurance information

      - collecting consent or required intake data where implemented

      - linking intake submission to the correct client/patient record

      - not creating duplicate clients when an existing client should be updated


      Before changing intake, inspect the intake route and intake client
      component.


      Check-In Rules


      Check-in must support:


      - appointment-linked check-in

      - client confirmation or update of relevant information

      - short patient-facing prompts when applicable

      - routing clinically relevant responses into the correct record

      - not creating billing claims directly unless the clinical workflow
      supports it


      Clinical Documentation Rules


      Clinical documentation must support:


      - draft notes

      - save without billing

      - sign note

      - signed notes becoming read-only where appropriate

      - documentation status

      - addendum or hold when requirements are missing

      - route to biller when billing review is needed

      - audit logging


      Saving a note is not the same as signing a note.

      Signing a complete note should trigger readiness evaluation.


      SOAP Note Rules


      SOAP note editor changes must preserve:


      - client

      - provider

      - encounter

      - note status

      - save behavior

      - sign behavior

      - clinical content

      - billing readiness connection


      Do not remove clinically necessary information to simplify UI.


      Portal Rules


      The client portal must support:


      - client-facing access where implemented

      - portal settings

      - journal functionality

      - health-record access concepts

      - patient-friendly language

      - privacy-safe presentation


      Portal journal entries should not be mixed into billing workflows unless
      explicitly designed.


      Inbox / Workqueue Rules


      Inbox and workqueues must be database-driven, not static mock lists.


      Workqueue items must have clear:


      - queue type

      - ticket type

      - status

      - source

      - related client

      - related encounter

      - related appointment

      - related claim when applicable

      - assigned role when applicable


      Do not create duplicate workqueues that show conflicting results.


      Chat Rules


      Chat must remain separate from clinical documentation unless a specific
      workflow links a chat item to a client, encounter, task, or audit event.


      Do not store PHI in a new place unless the existing design supports it.


      Mailroom Rules


      Mailroom must support document/item review and entity matching where
      implemented.


      Mailroom items should be connectable to the appropriate entity, such as
      client, claim, payer, provider, or encounter, depending on the existing
      route/component behavior.


      Staff / Users Rules


      Staff workflows must preserve:


      - user identity

      - role

      - provider/staff distinction

      - organization isolation

      - permission boundaries


      Do not expose one clinician’s data to another clinician unless the role
      model allows it.


      Settings / Admin Rules


      Settings and Admin must support configuration and system-readiness
      workflows.


      Billing defaults must be treated as configuration, not hard-coded UI-only
      values.


      Admin/system-readiness pages should identify missing configuration that
      would block operational workflows.


      Audit Log Rules


      Important workflow actions should create or preserve auditability,
      especially:


      - encounter creation

      - note signature

      - route to biller

      - claim creation

      - claim submission

      - payment posting

      - write-off

      - refund

      - statement generation

      - configuration changes when applicable


      Do not remove audit logging to make a workflow pass.


      Eligibility Rules


      Eligibility workflows must support:


      - policy linkage

      - payer response review

      - eligibility issue workqueue

      - failed or problematic eligibility checks

      - resolved issue removal from active queue


      Eligibility should feed billing readiness and workqueues where applicable.


      Authorization Rules


      Authorization workflows must support:


      - identifying services requiring authorization

      - missing authorization queue

      - expired authorization queue

      - linking authorization to client/policy/service when applicable


      Do not allow claims requiring authorization to pass cleanly if the system
      is supposed to block them.


      Charge Capture Rules


      Charge Capture must be the functional review area for charges generated
      from signed documentation.


      charge_capture_items is the bridge between encounter and professional
      claim.


      Do not create a separate disconnected charge table or duplicate charge
      workqueue.


      Charge Capture must show enough data for billing review:


      - client

      - provider

      - DOS

      - CPT/HCPCS

      - units

      - diagnosis

      - payer

      - charge amount

      - status

      - blocker reason when applicable

      - linked encounter

      - linked claim when applicable


      Claims Rules


      Claims must be traceable to:


      - client

      - encounter

      - provider

      - payer / policy

      - service lines

      - diagnosis

      - charge amount

      - claim status

      - submission status

      - claim status events

      - payment/adjudication result


      Do not create claims that are not linked back to source documentation.


      Ready to Generate / 837P Rules


      Ready to Generate must include only claims/charges that have passed
      readiness checks.


      837P generation must not silently succeed when required data is missing.


      Batch workflow must support:


      - batch creation

      - file generation

      - file name

      - claim count

      - batch status

      - validation errors

      - movement out of Ready to Generate after successful generation/submission


      Rejections Rules


      Rejections must distinguish:


      - 999 file/syntax rejection

      - 277CA claim-level rejection

      - payer rejection

      - transmission failure


      Rejected claims must remain traceable and correctable.


      Denials / AR Follow-Up Rules


      Denial and AR workflows must support:


      - denials by CARC

      - denials by RARC

      - partial denials

      - underpayments

      - medical necessity

      - medical review / records requested

      - timely filing

      - COB issues

      - secondary billing

      - appeals

      - corrected claims

      - resubmission


      Do not collapse all denials into one generic queue if the existing
      navigation separates them.


      ERA / Payment Posting Rules


      ERA and payment posting must support:


      - 835 import

      - ERA matching

      - unmatched ERA claims

      - manual payments

      - partial payments

      - unposted payments

      - paper checks

      - VCC payments if present

      - claim balance updates

      - client responsibility generation

      - audit/payment history where applicable


      Do not post payments in a way that fails to update AR.


      Client Responsibility / Statements Rules


      Client responsibility must be generated only from valid
      adjudication/self-pay logic.


      Statements must support:


      - balances ready for statement

      - statement generation

      - email statement when implemented

      - delivery logging

      - accurate client balance


      Do not generate a client statement from an unadjudicated insurance claim
      unless explicitly intended.


      Refunds / Credits / Recoupments / Write-Offs Rules


      These workflows must preserve financial auditability.


      Credit balances must show source and disposition.


      Refunds must be trackable.


      Write-offs must have reason and history.


      Recoupments/takebacks must not be treated as normal payments.


      Reporting Rules


      Reports must reconcile to operational records.


      Reports should not double-count duplicate workqueues or disconnected
      charge records.


      Key reporting areas include:


      - AR

      - production / charges

      - claims

      - payments

      - denials

      - patient/client balances

      - write-offs

      - reconciliation exceptions


      FHIR Rules


      FHIR mapping code exists for appointment, encounter, and observation.


      Do not alter FHIR mapping casually.


      FHIR exports/mappings must reflect actual internal record values.


      Security / Privacy Rules


      This is a healthcare system.


      Protect PHI.

      Preserve tenant/organization isolation.

      Do not expose client data across users, providers, or organizations.

      Do not bypass access control to make a screen work.

      Do not log sensitive PHI unnecessarily.


      Required Response Format Before Making a Fix


      For every requested change, first identify:


      1. Module

      2. Exact click path

      3. Existing files inspected

      4. Existing tables or Supabase calls involved

      5. Current behavior

      6. Expected behavior

      7. Status transition

      8. Workqueue movement, if applicable

      9. Audit log requirement, if applicable

      10. Smallest safe fix


      Required Completion Format


      After making or proposing a change, provide:


      1. Files changed

      2. Why each change was needed

      3. What workflow it fixes

      4. What database records should change

      5. What workqueue movement should happen

      6. Manual UAT steps

      7. Regression risk

      8. Anything not fixed


      Budget Rule


      Prefer the smallest safe fix that restores the intended workflow.


      Do not rewrite large modules unless the existing module is disconnected
      from the real database workflow.


      Do not create large new abstractions unless they replace duplicated broken
      logic and reduce maintenance cost.


      Additional Hard Rules


      Do not use manual SQL updates as the fix for workflow movement.


      Manual SQL may be used only to inspect records or repair test data after
      explaining why the application workflow failed.


      The actual fix must be in the application workflow, API route, server
      action, database function, or trigger that should run when the workflow
      action occurs.


      Do not silently succeed.


      If a required record, table, column, route, component, helper, or status
      value cannot be found, say exactly what could not be found.


      Do not guess.


      Do not claim a workflow is fixed unless the database movement, workqueue
      movement, and UI result are all accounted for.


      Do not make cosmetic-only changes to a broken workflow unless the user
      specifically asks for a visual redesign.


      Do not generate placeholder code when the existing repository has real
      code that should be inspected and repaired.


      Do not create a new page to avoid fixing the broken page.


      Do not create a new table to avoid understanding the existing schema.


      Do not create a mock list where a database-driven list is required.


      Do not remove validation, audit logging, tenant isolation, or workflow
      checks just to make a screen appear functional.
  - role: user
    content: >-
      Use the Therassistant EHR master project rules above.


      Fix this specific defect only:


      {{input}}


      Before proposing or making changes, identify:


      1. Module

      2. Exact click path

      3. Existing files inspected

      4. Existing tables or Supabase calls involved

      5. Current behavior

      6. Expected behavior

      7. Status transition

      8. Workqueue movement, if applicable

      9. Audit log requirement, if applicable

      10. Smallest safe fix


      Do not invent tables.

      Do not create duplicate screens.

      Do not create disconnected UI.

      Do not use manual SQL as the workflow fix.

      Do not rewrite large modules unless the existing module is proven
      disconnected.


      After the fix, provide:


      1. Files changed

      2. Why each change was needed

      3. What workflow it fixes

      4. What database records should change

      5. What workqueue movement should happen

      6. Manual UAT steps

      7. Regression risk

      8. Anything not fixed
  - role: assistant
    content: >
      Response Style Requirement


      Keep responses short, direct, and defect-focused.


      Do not summarize everything that is working.

      Do not provide a broad repo tour.

      Do not list unrelated files.

      Do not explain generic best practices.

      Do not give long background unless the defect cannot be understood without
      it.


      The response must identify:


      1. Exact problem found

      2. Exact file/component/API/workflow causing it

      3. Exact smallest fix

      4. Exact clicks the user needs to do, if any

      5. Exact UAT test clicks after the fix

      6. Anything still not fixed


      If no user action is needed, say:


      No clicks needed from you.


      If more information is needed, ask only for the missing item. Do not
      guess.
